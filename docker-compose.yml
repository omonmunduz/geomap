# Геопортал НИПД КР — MVP. Запуск: docker compose up --build  →  http://localhost:8088
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoportal
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geo}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geoportal"]
      interval: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-geo}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123}
      DEV_LOGIN: ${DEV_LOGIN:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_ZONING_CHECK: ${SEED_ZONING_CHECK:-true}
    volumes: [storage:/data]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8088:80"]
    # basic auth: создайте secrets/htpasswd (не коммитится), см. demo.sh
    volumes: ["./secrets/htpasswd:/etc/nginx/htpasswd:ro"]
    depends_on: [backend]

volumes:
  pgdata:
  storage:
