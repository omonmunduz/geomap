# Публичный демо-стенд: basic auth в nginx. Запускается только через ./demo.sh:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build -d
# secrets/htpasswd (логин demo) в git не попадает — как создать, см. README, «Демо-стенд».
# Запросы к /api с заголовком «Authorization: Bearer <JWT>» проходят без пароля (см. frontend/nginx.auth.conf).
services:
  frontend:
    volumes:
      - ./frontend/nginx.auth.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
