# Basic auth для демо-стенда: файл /etc/nginx/htpasswd монтируется томом (secrets/htpasswd, в git не попадает).
# Приложение само передаёт в /api заголовок «Authorization: Bearer <JWT>», а браузер не может отправить в одном
# запросе и Basic, и Bearer. Поэтому запросы к /api с Bearer пропускаются к backend, который проверяет подпись JWT
# (поддельный токен → 401 от backend). Всё остальное — только с паролем.
map $http_authorization $api_auth_realm {
  "~*^Bearer " off;
  default      "Geoportal demo";
}

server {
  listen 80;
  client_max_body_size 500m;
  root /usr/share/nginx/html;

  auth_basic           "Geoportal demo";
  auth_basic_user_file /etc/nginx/htpasswd;

  location /api/ {
    auth_basic $api_auth_realm;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }
  location /actuator/health { proxy_pass http://backend:8080; }
  location / { try_files $uri /index.html; }
}
